name: Publish development frontend
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to publish; leave blank to catch up official branches
        type: string
        required: false
      reviewed_custom:
        description: I reviewed this exact custom commit for publication on the shared UI origin
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: relay-ui-${{ inputs.revision || 'source-poll' }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.scan.outputs.plan }}
      revisions: ${{ steps.scan.outputs.revisions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2'
      - name: Find source revisions after the last publication
        id: scan
        env:
          REVISION: ${{ inputs.revision }}
          REVIEWED_CUSTOM: ${{ inputs.reviewed_custom }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/sync_source_ui.py discover
  identify:
    needs: discover
    if: needs.discover.outputs.revisions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        revision: ${{ fromJSON(needs.discover.outputs.revisions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ArkMowers/arknights-mower
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read the instance UI identifier before installing dependencies
        env:
          REVIEWED_CUSTOM: ${{ inputs.reviewed_custom }}
        run: |
          if [[ -f ui/src/utils/publicAsset.js ]]; then
            node --input-type=module -e "import {relayBuildId} from './ui/scripts/relayBuild.js'; console.log(relayBuildId(process.cwd()))" > "$RUNNER_TEMP/build-id"
            grep -Exq '[0-9a-f]{64}' "$RUNNER_TEMP/build-id"
          elif [[ "$REVIEWED_CUSTOM" == true ]]; then
            echo 'This revision predates relay UI support.' >&2
            exit 1
          else
            echo pre-relay-source > "$RUNNER_TEMP/build-id"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relay-id-${{ matrix.revision }}
          path: ${{ runner.temp }}/build-id
          if-no-files-found: error
  select:
    needs: [discover, identify]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.revisions != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.select.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: relay-id-*
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'boto3>=1.36,<2'
      - name: Select one source revision per missing R2 manifest
        id: select
        env:
          REVISIONS: ${{ needs.discover.outputs.revisions }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/sync_source_ui.py select
  build:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.builds != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.select.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ArkMowers/arknights-mower
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ${{ !inputs.reviewed_custom && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json
      - name: Build the selected frontend
        working-directory: ui
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: relay-ui-${{ matrix.build }}
          path: ui/dist/
          if-no-files-found: error
  publish:
    needs: [discover, select, build]
    if: ${{ !cancelled() && needs.select.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: relay-*
          path: artifacts
      - run: python -m pip install 'boto3>=1.36,<2'
      - name: Publish and checkpoint each branch in order
        env:
          PLAN: ${{ needs.discover.outputs.plan }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/sync_source_ui.py finish
