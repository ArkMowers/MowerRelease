name: Publish Mower OTA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Mower Release tag (blank checks latest stable and beta)
        type: string
        required: false
      source_limit:
        description: Number of older releases to consider
        type: number
        default: 5
        required: true
      mirror_only:
        description: Mirror full packages for the selected tag without changing channel indexes
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '23,53 * * * *'

permissions:
  contents: write

concurrency:
  group: publish-mower-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OTA builder dependency
        run: python -m pip install bsdiff4==1.2.6
      - name: Test OTA package format
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Generate and publish OTA packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_LIMIT: ${{ inputs.source_limit || 5 }}
          MIRROR_ONLY: ${{ inputs.mirror_only || false }}
        run: |
          args=(--source-limit "$SOURCE_LIMIT")
          if [[ -n "$TAG" ]]; then args+=(--tag "$TAG"); fi
          if [[ "$MIRROR_ONLY" == "true" ]]; then args+=(--mirror-only); fi
          python scripts/publish.py "${args[@]}"
      - name: Commit channel index
        run: |
          if [[ -n "$(git status --porcelain -- version)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version
            git commit -m 'chore: update OTA channel index'
            git pull --rebase origin main
            git push
          fi
